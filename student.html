<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속지 말고 잡아라! 팩트체크 — 학생 화면</title>
<link rel="stylesheet" href="style.css">
<script>window.SAFE={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</head>
<body>
<div class="topbar"><button class="iconbtn" id="tocb" aria-label="목차">☰ 목차</button><span class="sp"></span><span id="who" class="pill"></span><span class="pill"><span id="conn" class="dot"></span><span id="connt">연결 중</span></span></div>
<main class="stage" id="stage"></main>
<div class="drawer" id="drawer"><div class="bgk" id="bgk"></div><nav id="toc"></nav></div>
<div id="modal"></div>
<script>
const params = new URLSearchParams(location.search);
const ROOM = params.get("room") || DEFAULT_ROOM;
const K = `fcd1_${ROOM}${params.get("u") ? "_" + params.get("u") : ""}`;
let me = JSON.parse(SAFE.get(K) || "null");
if (!me && params.get("name")) me = { sid: "p_" + (params.get("u") || "x"), name: params.get("name") };
const D = { state: { step: 0, reveal: false } };
let live = false, view = null, openSid = null, sig = "", seq = [], draft = {}, galleryOverlay = false;
const $ = id => document.getElementById(id);
const ctx = () => ({ role: "student", sid: me.sid, name: me.name });

DB.onConnection(on => { $("conn").className = "dot" + (on ? " on" : ""); $("connt").textContent = DB.mode === "demo" ? "데모 모드" : (on ? "연결됨" : "연결 끊김"); });

function showJoin() {
  $("tocb").style.visibility = "hidden";
  $("stage").innerHTML = UI.frame("수업에 참여하기", `<div class="join">
    <div class="sub">방: <b>${UI.esc(ROOM)}</b></div>
    <label for="nm"><b>이름</b> <small>(번호와 이름, 예: 12 홍길동)</small></label><input id="nm" maxlength="14" autocomplete="off">
    <button class="btn" id="go">입장하기</button>
    <p class="hint">이름은 우리 반 수업 화면에만 쓰여요.</p></div>`);
  const go = () => { const name = $("nm").value.trim(); if (!name) return $("nm").focus();
    me = { sid: (me && me.sid) || Math.random().toString(36).slice(2, 10), name }; SAFE.set(K, JSON.stringify(me)); start(); };
  $("go").onclick = go; $("nm").onkeydown = e => { if (e.key === "Enter") go(); };
}

function start() {
  $("tocb").style.visibility = "";
  $("who").textContent = me.name;
  DB.update(`${ROOM}/students/${me.sid}`, { name: me.name, at: DB.now() });
  DB.listen(`${ROOM}/state`, v => { const prev = D.state.step; D.state = v || { step: 0, reveal: false }; live = true; if (prev !== D.state.step) { if (view !== null && view >= D.state.step) view = null; if (view === null) scrollTo(0, 0); } render(); });
  ["students", "quiz", "poll", "ai", "sort", "cards", "entries", "votes", "hidden"].forEach(k => DB.listen(`${ROOM}/${k}`, v => { D[k] = v || {}; render(); }));
  $("tocb").onclick = () => { drawToc(); $("drawer").classList.add("on"); };
  $("bgk").onclick = () => $("drawer").classList.remove("on");
}

function drawToc() {
  const cur = D.state.step; let html = "", lastSec = "";
  DAYS.forEach(d => {
    html += `<div class="day ${d.detail ? "" : "off"}">${d.day}<small>${UI.esc(d.title)}</small></div>`;
    if (!d.detail) return;
    STEPS.forEach((s, i) => {
      if (s.sec !== lastSec) { html += `<h4>${UI.esc(s.sec)}</h4>`; lastSec = s.sec; }
      const here = (view === null ? cur : view) === i;
      html += `<button class="it ${here ? "cur" : ""} ${s.t !== "slide" ? "act" : ""}" data-i="${i}" ${i > cur ? "disabled" : ""}>${UI.esc(s.title)}${i === cur ? " ◀ 지금" : ""}</button>`;
    });
  });
  $("toc").innerHTML = `<p class="hint">지나간 화면은 눌러서 다시 볼 수 있어요.</p>` + html;
  $("toc").querySelectorAll("button.it").forEach(b => b.onclick = () => { const i = +b.dataset.i; view = i === D.state.step ? null : i; $("drawer").classList.remove("on"); sig = ""; scrollTo(0, 0); render(); });
  const c = $("toc").querySelector(".cur"); if (c) c.scrollIntoView({ block: "center" });
}

function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let q = 0.75, out = c.toDataURL("image/jpeg", q);
      while (out.length > 260000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      res(out); }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function submitForm(st) {
  const e = Object.assign({}, (D.entries || {})[me.sid] || {}, draft);
  const v = k => UI.esc(e[k] || "");
  const harms = ["잘못된 정보 인식", "당사자 피해 · 부당 이익", "사회 갈등 · 신뢰 약화"];
  const saved = (D.entries || {})[me.sid];
  st.innerHTML = UI.frame("출품 카드 만들기", `<div class="form">
    ${saved ? `<div class="done">출품 완료! 고쳐서 다시 제출하면 마지막 내용으로 바뀌어요.${(D.hidden || {})[me.sid] ? " (선생님이 이 카드를 숨겼어요. 내용을 고쳐 주세요.)" : ""}</div>` : `<div class="sub">별표(*) 칸은 꼭 채워요. 쓰는 중에 화면이 넘어가도 내용은 이 기기에 남아 있어요.</div>`}
    <label>출품작 제목 *<small> 예: “조선인이 우물에 독을 탔다” — 지진보다 무서웠던 소문</small></label><input type="text" id="f_title" maxlength="60" value="${v("title")}">
    <label>분류 *</label><select id="f_kind">${["내 주변의 가짜뉴스", "역사 속 가짜뉴스"].map(k => `<option ${e.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select>
    <label>언제 · 어디서</label><input type="text" id="f_when" maxlength="60" value="${v("when")}">
    <label>어떤 거짓이었나요? *</label><textarea id="f_lie" maxlength="200">${v("lie")}</textarea>
    <div class="stg s1"><label>1단계 유포 * <small>누가, 어디서 처음 퍼뜨렸나요?</small></label><textarea id="f_s1" maxlength="250">${v("s1")}</textarea></div>
    <div class="stg s2"><label>2단계 증폭 * <small>무엇이 더 크게 퍼뜨렸나요?</small></label><textarea id="f_s2" maxlength="250">${v("s2")}</textarea></div>
    <div class="stg s3"><label>3단계 피해 * <small>누가 어떤 피해를 입었나요?</small></label><textarea id="f_s3" maxlength="250">${v("s3")}</textarea>
      <div class="checks">${harms.map((h, i) => `<label><input type="checkbox" data-harm="${h}" ${(e.harms || []).includes(h) ? "checked" : ""}> ${h}</label>`).join("")}</div></div>
    <label>왜 사람들이 믿었을까?</label><textarea id="f_why" maxlength="200">${v("why")}</textarea>
    <label>진실과 출처 * <small>무엇이 진실이고, 어디서 확인했나요? (기관·언론·백과사전)</small></label><textarea id="f_truth" maxlength="300">${v("truth")}</textarea>
    <label>출처 링크 <small>(있으면)</small></label><input type="text" id="f_link" maxlength="300" value="${v("link")}" inputmode="url">
    <label>관련 자료 이미지 * <small>기사 캡처, 자료 사진 1장 (잔인한 사진, 일반인 얼굴은 안 돼요)</small></label><input type="file" id="f_img" accept="image/*">
    ${e.img ? `<img class="preview" src="${e.img}" alt="첨부 이미지">` : ""}
    <label>한 줄 교훈</label><input type="text" id="f_lesson" maxlength="80" value="${v("lesson")}">
    <label>함께 만든 친구 <small>(짝과 했다면 친구 이름, 입장할 때 쓴 이름과 똑같이)</small></label><input type="text" id="f_partner" maxlength="14" value="${v("partner")}">
    <div class="actions"><button class="btn" id="f_go">출품하기</button></div><p class="hint" id="f_msg"></p></div>`);
  const ids = ["title", "kind", "when", "lie", "s1", "s2", "s3", "why", "truth", "link", "lesson", "partner"];
  const collect = () => { ids.forEach(k => draft[k] = $("f_" + k).value); draft.harms = [...st.querySelectorAll("[data-harm]")].filter(x => x.checked).map(x => x.dataset.harm); if (e.img && !draft.img) draft.img = e.img; SAFE.set(K + "_draft", JSON.stringify(draft)); };
  st.querySelectorAll("input,textarea,select").forEach(x => x.addEventListener("input", collect));
  $("f_img").onchange = async ev => { const f = ev.target.files[0]; if (!f) return; $("f_msg").textContent = "이미지 줄이는 중…";
    try { collect(); draft.img = await compress(f); SAFE.set(K + "_draft", JSON.stringify(draft)); sig = ""; render(); } catch (err) { $("f_msg").textContent = "이 이미지는 열 수 없어요. 다른 이미지(JPG, PNG)를 골라 주세요."; } };
  $("f_go").onclick = () => {
    collect();
    const need = { title: "제목", lie: "어떤 거짓", s1: "1단계 유포", s2: "2단계 증폭", s3: "3단계 피해", truth: "진실과 출처" };
    const miss = Object.keys(need).filter(k => !(draft[k] || "").trim()).map(k => need[k]);
    if (!draft.img) miss.push("관련 자료 이미지");
    if (miss.length) { $("f_msg").textContent = "아직 비어 있어요: " + miss.join(", "); return; }
    DB.set(`${ROOM}/entries/${me.sid}`, Object.assign({}, draft, { name: me.name, at: Date.now() }));
    if ((D.hidden || {})[me.sid]) DB.remove(`${ROOM}/hidden/${me.sid}`);
    $("f_msg").textContent = "제출했어요!";
  };
}

function cardsGame(st) {
  const mine = (D.cards || {})[me.sid];
  const seqHtml = seq.length ? seq.map((id, i) => `<span class="slot"><small>${i + 1}</small>${id}</span>`).join("") : `<span class="ph">가장 오래된 사건부터 카드를 차례로 누르세요</span>`;
  const list = CARDS.map(c => `<button class="hc ${seq.includes(c.id) ? "used" : ""}" data-id="${c.id}" ${seq.includes(c.id) ? "disabled" : ""}><span class="id">${c.id}</span>${UI.esc(c.text)}</button>`).join("");
  st.innerHTML = UI.frame("팩트체크 연대기 순서 맞히기", `
    <h3 class="h" style="margin-top:0">내 순서 (${seq.length}/10)</h3><div class="seq">${seqHtml}</div>
    <div class="actions"><button class="btn ghost" id="undo" ${seq.length ? "" : "disabled"}>하나 지우기</button><button class="btn ghost" id="clr" ${seq.length ? "" : "disabled"}>처음부터</button>
      <button class="btn" id="sub" ${seq.length === 10 ? "" : "disabled"}>제출하기</button></div>
    ${mine ? `<div class="done">제출 완료: ${UI.esc(mine.order.split("").join(" → "))}<br><small>다시 제출하면 마지막 제출만 남아요. 점수는 정답 공개 때 확인!</small></div>` : ""}
    <h3 class="h">사건 카드</h3><div class="cardlist">${list}</div>`);
  st.querySelectorAll(".hc").forEach(b => b.onclick = () => { if (seq.length < 10) { seq.push(b.dataset.id); sig = ""; render(); } });
  $("undo").onclick = () => { seq.pop(); sig = ""; render(); };
  $("clr").onclick = () => { seq = []; sig = ""; render(); };
  $("sub").onclick = () => DB.set(`${ROOM}/cards/${me.sid}`, { order: seq.join(""), name: me.name, at: Date.now() });
}

function render() {
  if (!me) return;
  if (!live) { $("stage").innerHTML = `<div class="wait">선생님이 수업을 시작하기를 기다리는 중…</div>`; return; }
  const idx = view === null ? D.state.step : view;
  const step = STEPS[idx] || STEPS[0], st = $("stage");
  const banner = view !== null ? `<div class="review">지난 화면 다시 보기: ${UI.esc(step.title)}<span class="sp"></span><button id="back">선생님 화면으로</button></div>` : "";
  // 입력 중인 화면은 내 데이터가 바뀔 때만 다시 그리기
  let s = `${idx}|${view}`;
  if (step.t === "submit") s += `|${((D.entries || {})[me.sid] || {}).at || ""}|${(D.hidden || {})[me.sid] ? 1 : 0}`;
  if (step.t === "cards") s += `|${seq.join("")}|${((D.cards || {})[me.sid] || {}).at || ""}`;
  if (step.t === "submit" || step.t === "cards") {
    if (s === sig) return; sig = s;
    const wrap = document.createElement("div");
    st.innerHTML = banner; st.appendChild(wrap);
    step.t === "submit" ? submitForm(wrap) : cardsGame(wrap);
  } else {
    sig = "";
    let h = "";
    if (step.t === "slide") h = step.html;
    else if (step.t === "quiz") h = UI.quiz(step, D, ctx());
    else if (step.t === "quizSummary") h = UI.quizSummary(D, ctx());
    else if (step.t === "poll") h = UI.poll(D, ctx());
    else if (step.t === "aiface") h = UI.aiface(D, ctx());
    else if (step.t === "sort") h = UI.sort(D, ctx());
    else if (step.t === "cardsResult") h = UI.cardsResult(D, ctx());
    else if (step.t === "gallery") h = UI.gallery(D, ctx());
    else if (step.t === "vote") h = galleryOverlay ? UI.gallery(D, ctx()).replace('<div class="card">', '<div class="card"><div class="actions"><button class="btn" data-gal="0">투표로 돌아가기</button></div>') : UI.vote(D, ctx());
    else if (step.t === "voteResult") h = UI.voteResult(D, ctx());
    st.innerHTML = banner + h;
    st.querySelectorAll("[data-ox]").forEach(b => b.onclick = () => DB.set(`${ROOM}/quiz/${step.q}/${me.sid}`, b.dataset.ox));
    st.querySelectorAll("[data-poll]").forEach(b => b.onclick = () => DB.set(`${ROOM}/poll/${me.sid}`, +b.dataset.poll));
    st.querySelectorAll("[data-ai]").forEach(b => b.onclick = () => DB.set(`${ROOM}/ai/${me.sid}`, +b.dataset.ai));
    st.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => DB.set(`${ROOM}/sort/${me.sid}/${b.dataset.sort}`, b.dataset.k));
    st.querySelectorAll("[data-aw]").forEach(b => b.onclick = () => DB.set(`${ROOM}/votes/${me.sid}/${b.dataset.aw}`, b.dataset.e));
    st.querySelectorAll("[data-gal]").forEach(b => b.onclick = () => { galleryOverlay = b.dataset.gal === "1"; scrollTo(0, 0); render(); });
    st.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { openSid = b.dataset.open; render(); });
  }
  if (step.t !== "vote") galleryOverlay = false;
  $("modal").innerHTML = openSid && ["gallery", "vote", "voteResult"].includes(step.t) ? UI.modal(D, openSid, ctx()) : "";
  $("modal").querySelectorAll("[data-close]").forEach(b => b.onclick = ev => { if (ev.target === b) { openSid = null; render(); } });
  if ($("back")) $("back").onclick = () => { view = null; sig = ""; scrollTo(0, 0); render(); };
}

try { draft = JSON.parse(SAFE.get(K + "_draft") || "{}") || {}; } catch (e) { draft = {}; }
if (me && me.name) start(); else showJoin();
</script>
</body>
</html>
